services:
  opencode:
    image: ghcr.io/anomalyco/opencode:2.2.5
    container_name: opencode
    command: ["serve", "--hostname", "0.0.0.0", "--port", "4096"]
    stdin_open: true
    tty: true
    working_dir: /workspace
    environment:
      - OPENCODE_PASSWORD=your_opencode_password_here
      - GOOGLE_API_KEY=your_google_api_key_here
    ports:
      - "4096:4096"
    volumes:
      - "C:\\Projects:/workspace"
      - ./skills:/root/.config/opencode/skills
      - opencode_data:/root/.local/share/opencode

volumes:
  opencode_data:
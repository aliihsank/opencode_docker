services:
  opencode:
    image: ghcr.io/anomalyco/opencode:2.2.5
    container_name: opencode
    command: ["serve", "--hostname", "0.0.0.0", "--port", "4096"]
    stdin_open: true
    tty: true
    working_dir: /workspace
    ports:
      - "4096:4096"
    volumes:
      - .:/workspace
      - opencode_data:/root/.local/share/opencode

volumes:
  opencode_data: